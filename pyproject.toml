[project]
name = "end-to-end-ai-engineering"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alexio Junior Aaron", email = "ajay@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "groq>=1.7.0",
    "ipykernel>=7.4.0",
    "openai>=3.51.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/chatbot_ui",
]

[dependency-groups]
dev = [
    "langchain-community>=0.4.0,<0.4.2",
    "langchain-openai>=1.8.0",
    "langgraph>=1.2.22",
    "langsmith>=0.14.17",
    "matplotlib>=3.11.2",
    "pyarrow>=26.0.1",
    "qdrant-client>=1.20.0",
    "ragas>=0.3.1",
]
